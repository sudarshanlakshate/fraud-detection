name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python & install dependencies
        run: uv sync --frozen

      - name: Run linter & tests
        run: |
          uv run ruff check .
          # Uncomment below once you add pytest tests:
          # uv run pytest

      - name: Build Docker image
        run: docker build -t fraud-detection:latest .
